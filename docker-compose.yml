services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       sentinel
      POSTGRES_USER:     sentinel
      POSTGRES_PASSWORD: sentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["node", "node_modules/.bin/node-pg-migrate", "up"]
    environment:
      DATABASE_URL:  postgres://sentinel:sentinel@postgres:5432/sentinel
      JWT_SECRET:    dev_jwt_secret_change_in_production_must_be_long
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  api:
    build: .
    command: ["node", "src/server.js"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:      production
      DATABASE_URL:  postgres://sentinel:sentinel@postgres:5432/sentinel
      REDIS_URL:     redis://redis:6379
      JWT_SECRET:    dev_jwt_secret_change_in_production_must_be_long
      LOG_LEVEL:     info
      # Add SMTP_HOST, SMTP_USER, SMTP_PASS, TELEGRAM_BOT_TOKEN as needed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  scheduler:
    build: .
    command: ["node", "src/workers/scheduler.js"]
    environment:
      NODE_ENV:      production
      DATABASE_URL:  postgres://sentinel:sentinel@postgres:5432/sentinel
      REDIS_URL:     redis://redis:6379
      JWT_SECRET:    dev_jwt_secret_change_in_production_must_be_long
      LOG_LEVEL:     info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  checker:
    build: .
    command: ["node", "src/workers/checker.js"]
    environment:
      NODE_ENV:      production
      DATABASE_URL:  postgres://sentinel:sentinel@postgres:5432/sentinel
      REDIS_URL:     redis://redis:6379
      JWT_SECRET:    dev_jwt_secret_change_in_production_must_be_long
      LOG_LEVEL:     info
      CHECKER_CONCURRENCY: "20"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
